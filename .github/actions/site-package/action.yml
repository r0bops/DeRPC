name: Build and package the site
description: >
  Install, type-check, test, build the assembled site, run the offline release check and package
  web/dist for IPFS. Nothing is published.

inputs:
  tor-gateways:
    description: Public tor-js gateway addresses compiled into the dashboard (ip:port:certhash, comma-separated).
    required: true

outputs:
  cid:
    description: Root CID of the packaged site.
    value: ${{ steps.package.outputs.cid }}
  contenthash:
    description: ENSIP-7 contenthash bytes for that root.
    value: ${{ steps.package.outputs.contenthash }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Type check
      shell: bash
      run: pnpm typecheck
    - name: Test
      shell: bash
      run: pnpm -r --workspace-concurrency=1 --if-present test
    - name: Test the restricted VPS release command
      shell: bash
      run: python3 -m unittest discover -s scripts/vps -p 'test_*.py'
    - name: Build the site
      shell: bash
      env:
        VITE_TOR_GATEWAYS: ${{ inputs.tor-gateways }}
      run: pnpm build:site
    - name: Offline release check
      shell: bash
      env:
        VITE_TOR_GATEWAYS: ${{ inputs.tor-gateways }}
      run: node scripts/check-release.mjs
    - uses: ./.github/actions/install-kubo
    - name: Package for IPFS
      id: package
      shell: bash
      env:
        VITE_TOR_GATEWAYS: ${{ inputs.tor-gateways }}
      run: node scripts/package-ipfs.mjs
