name: Build and package the site
description: >
  Install, type-check, test, build the assembled site, run the offline release check and package
  web/dist for IPFS. Nothing is published.

inputs:
  tor-gateways:
    description: Public tor-js gateway addresses compiled into the dashboard (ip:port:certhash, comma-separated).
    required: true

outputs:
  cid:
    description: Root CID of the packaged site.
    value: ${{ steps.package.outputs.cid }}
  contenthash:
    description: ENSIP-7 contenthash bytes for that root.
    value: ${{ steps.package.outputs.contenthash }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Type check
      shell: bash
      run: pnpm typecheck
    - name: Test
      shell: bash
      run: pnpm -r --workspace-concurrency=1 --if-present test
    - name: Build the site
      shell: bash
      env:
        VITE_TOR_GATEWAYS: ${{ inputs.tor-gateways }}
      run: pnpm build:site
    - name: Offline release check
      shell: bash
      env:
        VITE_TOR_GATEWAYS: ${{ inputs.tor-gateways }}
      run: node scripts/check-release.mjs
    - name: Install Kubo
      shell: bash
      env:
        # The release and archive hash recorded in web/deployment-ens-ipfs-2026-11-06.json.
        KUBO_VERSION: 0.43.1
        KUBO_SHA256: 3f2bf974ab2a3ec6d997fac7d8cb46f59983a7cddd0b55ef998e6ce379155fb2
      run: |
        archive="kubo_v${KUBO_VERSION}_linux-amd64.tar.gz"
        # The GitHub release first: dist.ipfs.tech was unreachable from hosted runners. Either source
        # must match the recorded hash below, so the mirror is not trusted on its own.
        for url in "https://github.com/ipfs/kubo/releases/download/v${KUBO_VERSION}/$archive" "https://dist.ipfs.tech/kubo/v${KUBO_VERSION}/$archive"; do
          if curl -fsSL --connect-timeout 20 --max-time 180 --retry 2 -o "$RUNNER_TEMP/kubo.tar.gz" "$url"; then break; fi
          rm -f "$RUNNER_TEMP/kubo.tar.gz"
        done
        test -f "$RUNNER_TEMP/kubo.tar.gz"
        echo "${KUBO_SHA256}  $RUNNER_TEMP/kubo.tar.gz" | sha256sum --check --strict
        tar -xzf "$RUNNER_TEMP/kubo.tar.gz" -C "$RUNNER_TEMP" kubo/ipfs
        echo "IPFS_BIN=$RUNNER_TEMP/kubo/ipfs" >> "$GITHUB_ENV"
    - name: Package for IPFS
      id: package
      shell: bash
      env:
        VITE_TOR_GATEWAYS: ${{ inputs.tor-gateways }}
      run: node scripts/package-ipfs.mjs
