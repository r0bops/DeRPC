name: Publish derpc.eth through IPNS

# main is the release branch. No Ethereum wallet or IPNS private key enters GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked release (disable for packaging only)
        type: boolean
        default: true

permissions:
  contents: read

# A canceled publish may already have saved its signed record. The VPS also keeps
# a durable watermark because workflow queue order does not guarantee commit order.
concurrency:
  group: release-ens
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      cid: ${{ steps.site.outputs.cid }}
    steps:
      - name: Require the release gateway setting
        env:
          TOR_GATEWAYS: ${{ vars.DERPC_TOR_GATEWAYS }}
        run: |
          test -n "$TOR_GATEWAYS" || { echo '::error::Set DERPC_TOR_GATEWAYS to the public gateway address.'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: site
        uses: ./.github/actions/site-package
        with:
          tor-gateways: ${{ vars.DERPC_TOR_GATEWAYS }}
          ens-directory: ${{ vars.DERPC_ENS_DIRECTORY }}
          ens-operator-deployment: ${{ vars.DERPC_ENS_OPERATOR_DEPLOYMENT }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-ipfs-release
          path: web/out/ipfs-release
          retention-days: 90
          if-no-files-found: error

  deploy:
    needs: package
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: ens-production
      url: https://derpc.eth.limo
    env:
      CID: ${{ needs.package.outputs.cid }}
      PIN_HOST: ${{ vars.DERPC_PIN_HOST }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: ./.github/actions/install-kubo
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-ipfs-release
          path: release
      - name: Bind the package to this tested commit
        id: checked
        run: node scripts/check-site-package.mjs release "$CID" "$GITHUB_SHA"
      - name: Prepare restricted SSH access
        env:
          PIN_KNOWN_HOSTS: ${{ vars.DERPC_PIN_KNOWN_HOSTS }}
          PIN_SSH_KEY: ${{ secrets.DERPC_PIN_SSH_KEY }}
        run: |
          for name in PIN_HOST PIN_KNOWN_HOSTS PIN_SSH_KEY; do
            if [ -z "${!name}" ]; then echo "::error::$name is not configured for ens-production."; exit 1; fi
          done
          if ! [[ $PIN_HOST =~ ^[a-z_][a-z0-9_-]*@[A-Za-z0-9.-]+$ ]]; then echo '::error::Invalid deploy host.'; exit 1; fi
          install -d -m 700 "$RUNNER_TEMP/derpc-deploy"
          umask 077
          printf '%s\n' "$PIN_SSH_KEY" > "$RUNNER_TEMP/derpc-deploy/key"
          printf '%s\n' "$PIN_KNOWN_HOSTS" > "$RUNNER_TEMP/derpc-deploy/known_hosts"
      - name: Validate and pin the CAR on the VPS
        env:
          CAR_SHA256: ${{ steps.checked.outputs.car_sha256 }}
        run: |
          ssh -i "$RUNNER_TEMP/derpc-deploy/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/derpc-deploy/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$PIN_HOST" "pin $CID $CAR_SHA256 $GITHUB_SHA" < release/site.car > release/pin-receipt.json
      - name: Retrieve and verify the pinned CID independently
        run: node scripts/verify-site-release.mjs --manifest release/manifest.json --phase pinned --out release/pinned-check.json
      - name: Check the public provider listing
        continue-on-error: true
        env:
          PIN_PEER_ID: ${{ vars.DERPC_PIN_PEER_ID }}
        run: |
          test -n "$PIN_PEER_ID" || { echo '::warning::DERPC_PIN_PEER_ID is unset; advisory provider check skipped.'; exit 1; }
          node scripts/verify-ipfs.mjs release/manifest.json --provider "$PIN_PEER_ID"
      - name: Publish only if this commit is still main
        env:
          GH_TOKEN: ${{ github.token }}
          CAR_SHA256: ${{ steps.checked.outputs.car_sha256 }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo '::error::A newer main commit exists. This release stays pinned but will not replace IPNS.'
            exit 1
          fi
          publish_code=0
          ssh -i "$RUNNER_TEMP/derpc-deploy/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/derpc-deploy/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$PIN_HOST" "publish $CID $CAR_SHA256 $GITHUB_RUN_NUMBER $GITHUB_RUN_ID $GITHUB_SHA" > release/publish-receipt.json || publish_code=$?
          ssh -i "$RUNNER_TEMP/derpc-deploy/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/derpc-deploy/known_hosts" -o ConnectTimeout=20 \
            "$PIN_HOST" status > release/publication-state.json
          node scripts/check-site-package.mjs --publication release/publication-state.json "$CID" "$CAR_SHA256" "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ID"
          if [ "$publish_code" != 0 ]; then
            echo '::warning::The VPS accepted this exact release but publication did not acknowledge completion. The public signature and website checks must still pass.'
          fi
      - name: Verify the public IPNS record and all ENS website files
        run: node scripts/verify-site-release.mjs --manifest release/manifest.json --phase published --out release/published-check.json
      - name: Remove the deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/derpc-deploy/key"
      - name: Save deployment receipts and verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-deployment-evidence
          path: |
            release/*-receipt.json
            release/*-check.json
            release/publication-state.json
          retention-days: 90
          if-no-files-found: warn

  summary:
    needs: [package, deploy]
    if: always() && needs.package.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Record the deployment result
        env:
          CID: ${{ needs.package.outputs.cid }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          {
            echo '## derpc.eth IPNS release'
            echo
            echo "Immutable release: \`ipfs://$CID\`"
            echo
            echo 'Stable ENS contenthash: `ipns://k51qzi5uqu5dip6ttqcmj10rokc1dq8ppmppbo05grxwha1yvabumx7k1k9jhc`'
            echo
            echo "Deployment and public verification: **$DEPLOY_RESULT**"
            echo
            if [ "$DEPLOY_RESULT" = success ]; then
              echo 'Live at https://derpc.eth.limo/. All files and the signed IPNS target were checked.'
            elif [ "$DEPLOY_RESULT" = skipped ]; then
              echo 'Package only; this run did not deploy.'
            else
              echo 'Inspect the deployment evidence before retrying. Publication may have taken effect even if a network or cache check failed. No automatic rollback was performed.'
            fi
            echo
            echo 'Preserve the existing ENS contenthash. No Ethereum transaction or gas payment is needed for this update.'
          } >> "$GITHUB_STEP_SUMMARY"
